name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AKARI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/akari.jks"
          echo "AKARI_KEYSTORE=$RUNNER_TEMP/akari.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          AKARI_KEYSTORE_PASSWORD: ${{ secrets.AKARI_KEYSTORE_PASSWORD }}
          AKARI_KEY_ALIAS: ${{ secrets.AKARI_KEY_ALIAS }}
          AKARI_KEY_PASSWORD: ${{ secrets.AKARI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "Akari-$VERSION.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "Akari-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "Akari-$VERSION.apk" --title "Akari $VERSION" --generate-notes
          fi
