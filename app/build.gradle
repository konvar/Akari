plugins {
    id 'com.android.application'
}

// Optional built-in app IDs (Trakt, Simkl, Nuvio sync), read from local.properties, which is never committed.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.konvar.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.konvar.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '0.3.1'
        buildConfigField 'String', 'TRAKT_CLIENT_ID', "\"${localProps.getProperty('TRAKT_CLIENT_ID', '')}\""
        buildConfigField 'String', 'TRAKT_CLIENT_SECRET', "\"${localProps.getProperty('TRAKT_CLIENT_SECRET', '')}\""
        // Other tracking services, from the same file: Simkl (PIN sign-in) and the Nuvio account (Supabase).
        buildConfigField 'String', 'SIMKL_CLIENT_ID', "\"${localProps.getProperty('SIMKL_CLIENT_ID', '')}\""
        buildConfigField 'String', 'SUPABASE_URL', "\"${localProps.getProperty('NUVIO_SUPABASE_URL', '')}\""
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${localProps.getProperty('NUVIO_SUPABASE_ANON_KEY', '')}\""
    }

    signingConfigs {
        // Release key from the environment (GitHub Actions secrets); local builds without it use the debug key.
        if (System.getenv('AKARI_KEYSTORE')) {
            release {
                storeFile file(System.getenv('AKARI_KEYSTORE'))
                storePassword System.getenv('AKARI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AKARI_KEY_ALIAS')
                keyPassword System.getenv('AKARI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('AKARI_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.zxing:core:3.5.3'
}
